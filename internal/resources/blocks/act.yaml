name: act
description: Generic linear action block — use `tests` when specifically writing tests, not for general implementation
params:
  max_turns: {default: "45"}
  timeout: {default: "900"}
  model: {default: ""}
  prompt: {default: "prompts/blocks/act.md"}
  focus: {default: ""}
  files: {default: ""}
entry: act
exits: [done]
states:
  - name: act
    description: Execute the task described by the prompt
    prompt: ${prompt}
    agent:
      max_turns: ${max_turns}
      timeout: ${timeout}
      model: ${model}
    next: $done
