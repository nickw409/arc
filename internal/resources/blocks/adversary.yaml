name: adversary
description: Write adversarial tests to find bugs — not for quality review; use `review` or `judge` for review tasks
params:
  max_turns: {default: "30"}
  prompt: {default: "prompts/blocks/adversary.md"}
entry: adversary
exits: [bugs_found, no_bugs_found]
states:
  - name: adversary
    description: Write adversarial tests to find bugs
    prompt: ${prompt}
    agent:
      max_turns: ${max_turns}
      allowed_tools: [Read, Grep, Glob, Write, Bash]
    verdicts: [bugs_found, no_bugs_found]
    next:
      bugs_found: $bugs_found
      no_bugs_found: $no_bugs_found
