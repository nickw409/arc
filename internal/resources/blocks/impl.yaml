name: impl
description: Free-form implementation with high turn count
params:
  max_turns: {default: "45"}
  timeout: {default: "900"}
  model: {default: ""}
  prompt: {default: "prompts/adversarial/impl.md"}
entry: impl
exits: [done]
states:
  - name: impl
    description: Implement the feature freely, writing code and tests
    prompt: ${prompt}
    agent:
      max_turns: ${max_turns}
      timeout: ${timeout}
      model: ${model}
    next: $done
