name: judge
description: Generic branching block with two parameterizable verdicts
params:
  prompt: {default: ""}
  verdict_a: {default: "approved"}
  verdict_b: {default: "rejected"}
  max_turns: {default: "15"}
entry: judge
exits: ["${verdict_a}", "${verdict_b}"]
states:
  - name: judge
    description: Evaluate and emit a verdict
    prompt: ${prompt}
    agent:
      max_turns: ${max_turns}
    verdicts: ["${verdict_a}", "${verdict_b}"]
    next:
      "${verdict_a}": "$${verdict_a}"
      "${verdict_b}": "$${verdict_b}"
