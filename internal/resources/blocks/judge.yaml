name: judge
description: Generic branching with custom verdicts — default choice for non-code/non-test review (documents, findings, research); do NOT use `test-review` or `review` when the domain doesn't match
params:
  prompt: {default: ""}
  verdict_a: {default: "approved"}
  verdict_b: {default: "rejected"}
  max_turns: {default: "15"}
  max_state_iterations: {default: ""}
  on_max_iterations: {default: ""}
entry: judge
exits: ["${verdict_a}", "${verdict_b}"]
states:
  - name: judge
    description: Evaluate and emit a verdict
    prompt: ${prompt}
    agent:
      max_turns: ${max_turns}
    verdicts: ["${verdict_a}", "${verdict_b}"]
    constraints:
      max_state_iterations: ${max_state_iterations}
      on_max_iterations: ${on_max_iterations}
    next:
      "${verdict_a}": "$${verdict_a}"
      "${verdict_b}": "$${verdict_b}"
