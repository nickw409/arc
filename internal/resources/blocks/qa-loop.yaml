name: qa-loop
description: QA writes tests, review approves or finds gaps, loop until approved
params:
  max_turns: {default: "15"}
entry: qa
exits: [approved]
states:
  - name: qa
    description: Write tests based on specification
    prompt: prompts/feature/qa.md
    agent:
      max_turns: 15
    next: qa_review

  - name: qa_review
    description: Review test coverage
    prompt: prompts/feature/qa-review.md
    agent:
      max_turns: 15
    verdicts: [approved, gaps_found]
    next:
      approved: $approved
      gaps_found: qa
