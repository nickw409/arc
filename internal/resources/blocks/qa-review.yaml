name: qa-review
description: Review test quality, emit approved or gaps_found
params:
  max_turns: {default: "15"}
  prompt: {default: "prompts/blocks/qa-review.md"}
entry: qa_review
exits: [approved, gaps_found]
states:
  - name: qa_review
    description: Review test coverage and quality
    prompt: ${prompt}
    agent:
      max_turns: ${max_turns}
    verdicts: [approved, gaps_found]
    next:
      approved: $approved
      gaps_found: $gaps_found
