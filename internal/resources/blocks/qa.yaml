name: qa
description: Write tests that capture intended behavior
params:
  max_turns: {default: "100"}
  timeout: {default: "1800"}
  prompt: {default: "prompts/feature/qa.md"}
entry: qa
exits: [done]
states:
  - name: qa
    description: Write tests capturing intended behavior
    prompt: ${prompt}
    agent:
      max_turns: ${max_turns}
      timeout: ${timeout}
    next: $done
