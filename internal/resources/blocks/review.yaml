name: review
description: Review implementation quality, emit approved or concerns
params:
  max_turns: {default: "15"}
  prompt: {default: "prompts/feature/impl-review.md"}
entry: impl_review
exits: [approved, concerns]
states:
  - name: impl_review
    description: Review implementation quality
    prompt: ${prompt}
    agent:
      max_turns: ${max_turns}
    verdicts: [approved, concerns]
    next:
      approved: $approved
      concerns: $concerns
