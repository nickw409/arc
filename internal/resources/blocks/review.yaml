name: review
description: Review implementation/code quality — use `test-review` for test quality review, `judge` for non-code review
params:
  max_turns: {default: "50"}
  timeout: {default: "900"}
  prompt: {default: "prompts/blocks/review.md"}
  max_state_iterations: {default: ""}
  on_max_iterations: {default: ""}
entry: impl_review
exits: [approved, concerns]
states:
  - name: impl_review
    description: Review implementation quality
    prompt: ${prompt}
    agent:
      max_turns: ${max_turns}
      timeout: ${timeout}
    verdicts: [approved, concerns]
    constraints:
      max_state_iterations: ${max_state_iterations}
      on_max_iterations: ${on_max_iterations}
    next:
      approved: $approved
      concerns: $concerns
