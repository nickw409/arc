name: test-review
description: Review test quality only — use `judge` for document/findings review, `review` for code/implementation review
params:
  max_turns: {default: "15"}
  prompt: {default: "prompts/blocks/test-review.md"}
  max_state_iterations: {default: ""}
  on_max_iterations: {default: ""}
entry: qa_review
exits: [approved, gaps_found]
states:
  - name: qa_review
    description: Review test coverage and quality
    prompt: ${prompt}
    agent:
      max_turns: ${max_turns}
    verdicts: [approved, gaps_found]
    constraints:
      max_state_iterations: ${max_state_iterations}
      on_max_iterations: ${on_max_iterations}
    next:
      approved: $approved
      gaps_found: $gaps_found
