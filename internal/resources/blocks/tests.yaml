name: tests
description: Write tests only — use `act` for general implementation tasks
params:
  max_turns: {default: "100"}
  timeout: {default: "1800"}
  prompt: {default: "prompts/blocks/tests.md"}
entry: tests
exits: [done]
states:
  - name: tests
    description: Write tests capturing intended behavior
    prompt: ${prompt}
    agent:
      max_turns: ${max_turns}
      timeout: ${timeout}
    next: $done
