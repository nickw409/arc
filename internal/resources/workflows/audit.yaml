name: audit
version: 1
description: Adversarial audit - adversary finds bugs, impl fixes, repeat until clean

pipeline:
  - block: adversary
    name: audit
    params: {max_turns: "30"}
    route:
      bugs_found: fix
      no_bugs_found: complete
  - block: act
    name: fix
    params: {max_turns: "45"}
    route:
      done: audit

terminal_states: [complete, blocked]
