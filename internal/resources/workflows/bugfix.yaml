name: bugfix
version: 1
description: Fix incorrect behavior

states:
  - name: investigate
    description: Understand current behavior and root cause
    prompt: prompts/bugfix/investigate.md
    next: regression_tests
    agent:
      max_turns: 100
      timeout: 1800
  - name: regression_tests
    description: Write tests defining correct behavior
    prompt: prompts/bugfix/regression-tests.md
    next: test_review
    agent:
      max_turns: 100
      timeout: 1800
  - name: test_review
    description: Review regression test coverage
    prompt: prompts/bugfix/test-review.md
    verdicts:
      - approved
      - gaps_found
    constraints:
      max_state_iterations: 3
      on_max_iterations: approved
    next:
      approved: fix
      gaps_found: regression_tests
    agent:
      max_turns: 50
      timeout: 900
  - name: fix
    description: Implement the fix
    prompt: prompts/bugfix/fix.md
    next: fix_review
    agent:
      max_turns: 200
      timeout: 3600
  - name: fix_review
    description: Review fix implementation
    prompt: prompts/bugfix/fix-review.md
    verdicts:
      - approved
      - concerns
    constraints:
      max_state_iterations: 3
      on_max_iterations: approved
    next:
      approved: complete
      concerns: fix
    agent:
      max_turns: 50
      timeout: 900
  - name: complete
    description: Phase completed
    prompt: prompts/common/complete.md
  - name: blocked
    description: Phase blocked
    prompt: prompts/common/blocked.md

entry_state: investigate
terminal_states: [complete, blocked]
