name: direct
version: 1
description: Single-pass execution for simple tasks

states:
  - name: execute
    description: Execute the task directly
    prompt: prompts/direct/execute.md
    next: complete
    agent:
      max_turns: 200
      timeout: 3600

  - name: complete
    description: Task completed
    prompt: prompts/common/complete.md

  - name: blocked
    description: Task blocked
    prompt: prompts/common/blocked.md

entry_state: execute
terminal_states: [complete, blocked]
