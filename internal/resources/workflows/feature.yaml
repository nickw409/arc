name: feature
version: 4
description: Implement a feature and harden it with adversarial review

pipeline:
  - block: act
    name: impl
    params:
      prompt: "prompts/feature/impl.md"
      max_turns: "200"
      timeout: "3600"
  - parallel:
      strategy: all
      blocks:
        - name: check-a
          block: adversary
          params: {focus: "core functionality, edge cases, and boundary conditions", max_turns: "20", timeout: "1200"}
        - name: check-b
          block: adversary
          params: {focus: "error handling, integration points, and spec compliance", max_turns: "20", timeout: "1200"}
    run_once: true
    skip_exit: no_bugs_found
    route:
      bugs_found: impl
      no_bugs_found: complete

terminal_states: [complete, blocked]
