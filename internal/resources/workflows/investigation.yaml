name: investigation
version: 2
description: Research and produce findings

pipeline:
  - block: act
    name: research
    params:
      prompt: "prompts/investigation/research.md"
      max_turns: "100"
      timeout: "1800"
  - block: act
    name: draft
    params:
      prompt: "prompts/investigation/draft.md"
      max_turns: "100"
      timeout: "1800"
  - block: judge
    name: review
    params:
      prompt: "prompts/investigation/review.md"
      max_turns: "50"
      verdict_a: "approved"
      verdict_b: "gaps_found"
      max_state_iterations: "3"
      on_max_iterations: "approved"
    route:
      approved: complete
      gaps_found: draft

terminal_states: [complete, blocked]
