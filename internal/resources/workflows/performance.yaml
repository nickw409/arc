name: performance
version: 2
description: Optimize without changing behavior

pipeline:
  - block: act
    name: baseline
    params:
      prompt: "prompts/performance/baseline.md"
      max_turns: "100"
      timeout: "1800"
  - block: act
    name: analyze
    params:
      prompt: "prompts/performance/analyze.md"
      max_turns: "100"
      timeout: "1800"
  - block: act
    name: optimize
    params:
      prompt: "prompts/performance/optimize.md"
      max_turns: "200"
      timeout: "3600"
  - block: act
    name: benchmark
    params:
      prompt: "prompts/performance/benchmark.md"
      max_turns: "100"
      timeout: "1800"

terminal_states: [complete, blocked]
