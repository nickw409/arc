name: refactor
version: 2
description: Change structure without changing behavior

pipeline:
  - block: tests
    name: characterize
    params:
      prompt: "prompts/refactor/characterize.md"
      max_turns: "100"
      timeout: "1800"
  - block: test-review
    name: char_review
    params:
      prompt: "prompts/refactor/char-review.md"
      max_turns: "50"
      max_state_iterations: "3"
      on_max_iterations: "approved"
    route:
      approved: refactor
      gaps_found: characterize
  - block: act
    name: refactor
    params:
      prompt: "prompts/refactor/refactor.md"
      max_turns: "200"
      timeout: "3600"
  - block: review
    name: verify
    params:
      prompt: "prompts/refactor/verify.md"
      max_turns: "50"
      max_state_iterations: "3"
      on_max_iterations: "approved"
    route:
      approved: complete
      concerns: refactor

terminal_states: [complete, blocked]
