name: refactor
version: 1
description: Change structure without changing behavior

states:
  - name: characterize
    description: Write tests capturing current behavior
    prompt: prompts/refactor/characterize.md
    next: char_review
    agent:
      max_turns: 100
      timeout: 1800
  - name: char_review
    description: Review characterization tests
    prompt: prompts/refactor/char-review.md
    verdicts:
      - approved
      - gaps_found
    constraints:
      max_state_iterations: 3
      on_max_iterations: approved
    next:
      approved: refactor
      gaps_found: characterize
    agent:
      max_turns: 50
      timeout: 900
  - name: refactor
    description: Perform structural changes
    prompt: prompts/refactor/refactor.md
    next: verify
    agent:
      max_turns: 200
      timeout: 3600
  - name: verify
    description: Verify behavior unchanged
    prompt: prompts/refactor/verify.md
    verdicts:
      - approved
      - concerns
    constraints:
      max_state_iterations: 3
      on_max_iterations: approved
    next:
      approved: complete
      concerns: refactor
    agent:
      max_turns: 50
      timeout: 900
  - name: complete
    description: Refactor completed
    prompt: prompts/common/complete.md
  - name: blocked
    description: Refactor blocked
    prompt: prompts/common/blocked.md

entry_state: characterize
terminal_states: [complete, blocked]
