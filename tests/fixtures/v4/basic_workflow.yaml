name: test_v4_basic
version: 4
description: Basic V4 workflow for testing

defaults:
  max_iterations: 10

states:
  - name: impl
    prompt: prompts/feature/impl.md
    constraints:
      max_iterations: 5
    after:
      - action: run_tests
        params:
          pattern: "qa_test"
          save_to: test_output.txt
    next: review

  - name: review
    prompt: prompts/feature/impl-review.md
    verdicts: [approved, needs_fix]
    after:
      - action: commit
        when: approved
        params:
          message: "test commit"
    next:
      approved: complete
      needs_fix: impl

  - name: complete
    prompt: prompts/common/complete.md

entry_state: impl
terminal_states: [complete]
