name: test-parallel
version: 5
defaults:
  timeout: 60
states:
  - name: parallel_step
    parallel:
      strategy: all
      branches:
        - name: branch_a
          prompt: prompts/v5_prompts/branch_pass.md
        - name: branch_b
          prompt: prompts/v5_prompts/branch_pass.md
    verdicts:
      - all_complete
      - any_failed
    next:
      all_complete: done
      any_failed: blocked
  - name: done
    description: Success
  - name: blocked
    description: Failure
entry_state: parallel_step
terminal_states:
  - done
  - blocked
