name: test-mixed
version: 5
defaults:
  timeout: 60
states:
  - name: setup_state
    prompt: prompts/v5_prompts/branch_pass.md
    next: parallel_step
  - name: parallel_step
    parallel:
      strategy: all
      branches:
        - name: branch_a
          prompt: prompts/v5_prompts/branch_pass.md
        - name: branch_b
          prompt: prompts/v5_prompts/branch_pass.md
    verdicts:
      - all_complete
      - any_failed
    next:
      all_complete: finalize
      any_failed: blocked
  - name: finalize
    prompt: prompts/v5_prompts/branch_pass.md
    next: done
  - name: done
    description: Success
  - name: blocked
    description: Failure
entry_state: setup_state
terminal_states:
  - done
  - blocked
