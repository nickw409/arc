name: test-timeout
version: 5
defaults:
  timeout: 2
states:
  - name: parallel_step
    parallel:
      strategy: all
      branches:
        - name: branch_slow
          prompt: prompts/v5_prompts/branch_slow.md
    verdicts:
      - all_complete
      - any_failed
    next:
      all_complete: done
      any_failed: blocked
  - name: done
    description: Success
  - name: blocked
    description: Failure
entry_state: parallel_step
terminal_states:
  - done
  - blocked
